[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bytecode-review-agent"
version = "0.1.0"
description = "A recoverable and traceable AI code review backend and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ByteCodeReviewAgent contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
review-agent = "bytecode_review_agent.cli:app"

[project.entry-points."bytecode_review_agent.tools"]
# Third-party packages can register safe tools in this group.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bytecode_review_agent = ["web_dist/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bytecode_review_agent"]
